# ConfigMap: arquivo de configuração do Prometheus (prometheus.yml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoramento
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # 1) O próprio Prometheus
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # 2) Pods da aplicação: descobre quem tem a annotation prometheus.io/scrape="true"
      - job_name: flask-u2-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # 3) Estado dos objetos do Kubernetes (pods prontos, réplicas, HPA)
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoramento.svc:8080"]

      # 4) Consumo de CPU e memória dos containers (cAdvisor, via kubelet)
      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor